<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기준봉 스캐너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#edf0f4; --panel:#ffffff; --ink:#18202c; --sub:#667085; --rule:#d8dde5;
  --up:#e0383e; --down:#2b6cde; --mark:#f08c00; --band:rgba(240,140,0,.12); --hover:#f4f6f9;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0d1218; --panel:#141b24; --ink:#e6ebf2; --sub:#8a96a8; --rule:#232d3a;
    --up:#ff6a70; --down:#6ea2ff; --mark:#ffa62b; --band:rgba(255,166,43,.13); --hover:#1a232e;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
header{padding:22px 0 14px}
.brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
h1{margin:0; font-size:22px; font-weight:750; letter-spacing:-.02em}
.rule-line{margin:2px 0 0; color:var(--sub); font-size:13px}
.stamp{margin-left:auto; color:var(--sub); font-size:13px; text-align:right}
.stamp b{color:var(--ink); font-weight:650}

.stage{display:grid; grid-template-columns:320px minmax(0,1fr); gap:0; background:var(--panel); border:1px solid var(--rule)}
.index{border-right:1px solid var(--rule); min-width:0}
.index h2, .chartbox h2, .log h2{margin:0; font-size:14px; font-weight:700}
.index-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--rule)}
.count{color:var(--sub); font-size:13px}
.pick{
  display:grid; grid-template-columns:1fr auto; gap:2px 12px; width:100%; text-align:left;
  padding:12px 16px 12px 13px; border:0; border-left:3px solid transparent; border-bottom:1px solid var(--rule);
  background:transparent; color:inherit; font:inherit; cursor:pointer;
}
.pick:hover{background:var(--hover)}
.pick[aria-current="true"]{border-left-color:var(--mark); background:var(--hover)}
.pick:focus-visible{outline:2px solid var(--mark); outline-offset:-2px}
.pick .nm{font-weight:650}
.pick small{color:var(--sub); font-size:12.5px}
.pick .px{text-align:right; font-weight:600}
.empty{padding:18px 16px; color:var(--sub); font-size:14px; margin:0}

.chartbox{min-width:0; padding:14px 16px 10px}
.ch-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.ch-head h2{font-size:18px; letter-spacing:-.01em}
.ch-meta{color:var(--sub); font-size:13px}
#chartWrap{position:relative; margin-top:10px}
#chart{height:420px}
.tip{position:absolute; left:10px; top:8px; z-index:5; pointer-events:none; max-width:calc(100% - 90px);
  padding:7px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--panel); opacity:.95;
  font-size:12.5px; line-height:1.55; color:var(--ink)}
.tip b{font-weight:650}
.tip .d{color:var(--sub)}
.tip .on{color:var(--mark); font-weight:650}
.view{margin-top:6px; color:var(--sub); font-size:12.5px}
.key{display:flex; gap:16px; flex-wrap:wrap; color:var(--sub); font-size:12.5px; margin-top:6px}
.key i{display:inline-block; width:14px; height:3px; margin-right:6px; vertical-align:middle}
.key .sw{width:14px; height:10px; background:var(--band); border:1px solid var(--mark)}

.log{margin:18px 0 40px; background:var(--panel); border:1px solid var(--rule)}
.log-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--rule)}
.log input{
  width:190px; max-width:50%; padding:7px 10px; border:1px solid var(--rule); border-radius:4px;
  background:var(--paper); color:var(--ink); font:inherit; font-size:14px;
}
.log input:focus-visible{outline:2px solid var(--mark); outline-offset:1px}
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:640px}
th, td{padding:10px 16px; text-align:left; border-bottom:1px solid var(--rule); font-size:14px; white-space:nowrap}
th{color:var(--sub); font-weight:600; font-size:12.5px; background:var(--panel)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.num, th.num{text-align:right}
td small{display:block; color:var(--sub); font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.tag{display:inline-block; padding:1px 8px; border-radius:3px; font-size:12px; border:1px solid var(--rule); color:var(--sub)}
.tag.live{border-color:var(--mark); color:var(--mark)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .index{border-right:0; border-bottom:1px solid var(--rule)}
  #chart{height:340px}
  .stamp{margin-left:0; text-align:left; width:100%}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>기준봉 스캐너</h1>
      <div class="stamp" id="stamp">불러오는 중</div>
    </div>
    <p class="rule-line">120일선이 60일선 위로 역전한 날부터 60일 동안, 양봉이면서 종가가 최근 60거래일 모든 봉(음봉 포함)보다 높은 첫 봉</p>
  </div>
</header>

<main class="wrap">
  <section class="stage" aria-label="오늘의 기준봉과 차트">
    <div class="index">
      <div class="index-head"><h2>오늘 잡힌 종목</h2><span class="count" id="todayCount"></span></div>
      <div id="picks"></div>
    </div>
    <div class="chartbox">
      <div class="ch-head"><h2 id="chTitle">차트</h2><span class="ch-meta" id="chMeta"></span></div>
      <div id="chartWrap">
        <div id="chart" role="img" aria-label="캔들 차트"></div>
        <div class="tip" id="tip">차트 위에 마우스를 올리면 날짜와 며칠째인지 보여요</div>
      </div>
      <div class="view" id="view"></div>
      <div class="key">
        <span><i style="background:#f59e0b"></i>60일선</span>
        <span><i style="background:#8b5cf6"></i>120일선</span>
        <span><span class="sw" style="display:inline-block;margin-right:6px;vertical-align:middle"></span>역배열 60일 구간</span>
        <span><i style="background:#f08c00;height:0;border-top:2px dashed #f08c00"></i>직전 60봉 최고 종가</span>
      </div>
    </div>
  </section>

  <section class="log" aria-label="지난 기준봉">
    <div class="log-head"><h2>지난 기준봉</h2><input id="q" type="search" placeholder="종목명 또는 코드" aria-label="종목 검색"></div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>포착일</th><th>종목</th><th class="num">종가</th><th class="num">등락률</th><th>역배열 시작</th><th>구간 끝</th><th>상태</th>
        </tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
    <p class="empty" id="logEmpty" hidden></p>
  </section>
</main>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  const nf = new Intl.NumberFormat('ko-KR');
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const getJSON = async (p) => {
    const r = await fetch(p + '?t=' + Date.now());
    if (!r.ok) throw new Error(p + ' ' + r.status);
    return r.json();
  };
  const pct = (v) => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  const md = (iso) => iso ? iso.slice(5).replace('-', '/') : '';

  let today = [], history = [], asof = null, activeKey = null;
  let chart = null, candle = null, vol = null, m60 = null, m120 = null, band = null;
  let cur = null, hiLine = null;   // 지금 보고 있는 차트 데이터와 기준선

  const palette = () => dark()
    ? {bg:'#141b24', text:'#8a96a8', grid:'#1f2833', up:'#ff6a70', down:'#6ea2ff', band:'rgba(255,166,43,0.13)', mark:'#ffa62b'}
    : {bg:'#ffffff', text:'#667085', grid:'#eef0f4', up:'#e0383e', down:'#2b6cde', band:'rgba(240,140,0,0.12)', mark:'#f08c00'};

  function ensureChart() {
    if (chart) return;
    const el = $('#chart'), p = palette();
    chart = LightweightCharts.createChart(el, {
      width: el.clientWidth, height: el.clientHeight,
      layout: {background: {type: 'solid', color: p.bg}, textColor: p.text, fontFamily: 'inherit'},
      grid: {vertLines: {color: p.grid}, horzLines: {color: p.grid}},
      rightPriceScale: {borderColor: p.grid},
      timeScale: {borderColor: p.grid, timeVisible: false},
      crosshair: {mode: 0},
    });
    band = chart.addHistogramSeries({priceScaleId: 'band', priceLineVisible: false, lastValueVisible: false});
    chart.priceScale('band').applyOptions({scaleMargins: {top: 0, bottom: 0}, visible: false});
    candle = chart.addCandlestickSeries({
      upColor: p.up, downColor: p.down, borderUpColor: p.up, borderDownColor: p.down,
      wickUpColor: p.up, wickDownColor: p.down,
    });
    candle.priceScale().applyOptions({scaleMargins: {top: 0.08, bottom: 0.25}});
    vol = chart.addHistogramSeries({priceFormat: {type: 'volume'}, priceScaleId: 'vol', priceLineVisible: false, lastValueVisible: false});
    chart.priceScale('vol').applyOptions({scaleMargins: {top: 0.82, bottom: 0}});
    m60 = chart.addLineSeries({color: '#f59e0b', lineWidth: 2, priceLineVisible: false, lastValueVisible: false});
    m120 = chart.addLineSeries({color: '#8b5cf6', lineWidth: 2, priceLineVisible: false, lastValueVisible: false});
    new ResizeObserver(() => chart.applyOptions({width: el.clientWidth, height: el.clientHeight})).observe(el);
    chart.subscribeCrosshairMove(onMove);
    chart.timeScale().subscribeVisibleLogicalRangeChange(onRange);
  }

  const keyOf = (t) => (t && typeof t === 'object')
    ? `${t.year}-${String(t.month).padStart(2, '0')}-${String(t.day).padStart(2, '0')}` : t;
  const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400000);

  function onRange(r) {
    const v = $('#view');
    if (!cur || !r) { v.textContent = ''; return; }
    const n = cur.t.length;
    const from = Math.max(0, Math.ceil(r.from)), to = Math.min(n - 1, Math.floor(r.to));
    if (to < from) { v.textContent = ''; return; }
    const days = dayDiff(cur.t[to], cur.t[from]) + 1;
    v.textContent = `화면에 ${to - from + 1}봉 (${cur.t[from]} ~ ${cur.t[to]}, 달력 ${days}일)`;
  }

  function onMove(param) {
    const tip = $('#tip');
    if (!cur) return;
    const k = keyOf(param && param.time);
    const i = k ? cur.t.indexOf(k) : -1;
    if (i < 0) return;
    const o = cur.o[i], h = cur.h[i], l = cur.l[i], c = cur.c[i];
    const prev = i > 0 ? cur.c[i - 1] : null;
    const chg = prev ? ((c / prev - 1) * 100) : null;
    const parts = [`<b>${cur.t[i]}</b> <span class="d">시 ${nf.format(o)} 고 ${nf.format(h)} 저 ${nf.format(l)} 종 ${nf.format(c)}${chg == null ? '' : ' (' + pct(chg) + ')'}</span>`];
    if (k >= cur.cross_date) {
      const dn = dayDiff(k, cur.cross_date) + 1;
      const bn = cur.t.filter((t) => t >= cur.cross_date && t <= k).length;
      const inWin = k <= cur.window_end;
      parts.push(`역전 후 <span class="${inWin ? 'on' : ''}">${dn}일째</span> (${bn}번째 봉)${inWin ? '' : ' · 60일 지남'}`);
    } else {
      parts.push(`<span class="d">역전 전 (${dayDiff(cur.cross_date, k)}일 전에 역전)</span>`);
    }
    if (k === cur.signal_date) parts.push('<span class="on">기준봉</span>');
    const si = cur.t.indexOf(cur.signal_date);
    if (si >= 0 && i <= si && si - i < 60) parts.push(`<span class="d">기준봉 기준 ${si - i + 1}번째 전 봉 (60봉 안)</span>`);
    tip.innerHTML = parts.join('<br>');
  }

  async function showChart(s) {
    ensureChart();
    $('#chTitle').textContent = `${s.name} ${s.code}`;
    $('#chMeta').textContent = `${s.market} · 기준봉 ${s.signal_date} · 역배열 ${s.cross_date} 시작, ${s.day_no}일째`;
    let d;
    try { d = await getJSON('data/' + s.chart); }
    catch (e) { $('#chMeta').textContent = '차트 데이터를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'; return; }
    cur = d;
    const p = palette();
    const bars = d.t.map((t, i) => ({time: t, open: d.o[i], high: d.h[i], low: d.l[i], close: d.c[i]}));
    candle.setData(bars);
    vol.setData(d.t.map((t, i) => ({time: t, value: d.v[i], color: d.c[i] >= d.o[i] ? p.up + '66' : p.down + '66'})));
    const line = (arr) => d.t.map((t, i) => arr[i] == null ? null : {time: t, value: arr[i]}).filter(Boolean);
    m60.setData(line(d.ma60));
    m120.setData(line(d.ma120));
    band.setData(d.t.filter((t) => t >= d.cross_date && t <= d.window_end).map((t) => ({time: t, value: 1, color: p.band})));
    const marks = [];
    if (d.cross_date >= d.t[0]) marks.push({time: d.cross_date, position: 'aboveBar', color: p.down, shape: 'arrowDown', text: '역전'});
    marks.push({time: d.signal_date, position: 'belowBar', color: p.up, shape: 'arrowUp', text: '기준봉'});
    // 기준봉 직전 60봉(기준봉 포함)의 최고 종가(음봉 포함) = 기준봉 판정에 쓴 비교 기준
    const si = d.t.indexOf(d.signal_date);
    if (hiLine) { candle.removePriceLine(hiLine); hiLine = null; }
    if (si >= 0) {
      const from = Math.max(0, si - 59);
      if (from > 0) marks.push({time: d.t[from], position: 'belowBar', color: p.text, shape: 'circle', text: '60봉 전'});
      let mx = null;
      for (let j = from; j < si; j++) if (mx == null || d.c[j] > mx) mx = d.c[j];
      if (mx != null) hiLine = candle.createPriceLine({price: mx, color: p.mark, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '직전 60봉 최고'});
    }
    marks.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));
    candle.setMarkers(marks);
    chart.timeScale().fitContent();
  }

  function select(key, s) {
    activeKey = key;
    document.querySelectorAll('.pick').forEach((b) => b.setAttribute('aria-current', String(b.dataset.key === key)));
    showChart(s);
  }

  function renderToday() {
    const box = $('#picks');
    $('#todayCount').textContent = today.length ? `${today.length}종목` : '';
    if (!asof) { box.innerHTML = '<p class="empty">아직 첫 스캔 전이에요. GitHub의 Actions 탭에서 scan을 한 번 실행해 주세요.</p>'; return; }
    if (!today.length) { box.innerHTML = `<p class="empty">${esc(asof)} 장 마감 기준으로 새 기준봉이 없어요.</p>`; return; }
    box.innerHTML = today.map((s, i) => `
      <button class="pick" data-i="${i}" data-key="t:${esc(s.code)}" aria-current="false">
        <span class="nm">${esc(s.name)}</span>
        <span class="px">${nf.format(s.close)}</span>
        <small>${esc(s.code)} · ${esc(s.market)}</small>
        <span class="px ${s.change_pct >= 0 ? 'up' : 'down'}">${pct(s.change_pct)}</span>
      </button>`).join('');
    box.querySelectorAll('.pick').forEach((b) => b.addEventListener('click', () => select(b.dataset.key, today[+b.dataset.i])));
  }

  function renderLog() {
    const q = $('#q').value.trim().toLowerCase();
    const rows = history.filter((h) => !q || h.name.toLowerCase().includes(q) || h.code.includes(q)).slice(0, 300);
    $('#logBody').innerHTML = rows.map((h) => {
      const live = asof && h.window_end >= asof;
      return `<tr data-code="${esc(h.code)}" data-date="${esc(h.signal_date)}">
        <td>${esc(h.signal_date)}</td>
        <td><b>${esc(h.name)}</b><small>${esc(h.code)} · ${esc(h.market)}</small></td>
        <td class="num">${nf.format(h.close)}</td>
        <td class="num ${h.change_pct >= 0 ? 'up' : 'down'}">${pct(h.change_pct)}</td>
        <td>${esc(h.cross_date)}</td>
        <td>${esc(h.window_end)}</td>
        <td><span class="tag ${live ? 'live' : ''}">${live ? '진행 중' : '확정'}</span></td>
      </tr>`;
    }).join('');
    const empty = $('#logEmpty');
    empty.hidden = rows.length > 0;
    empty.textContent = history.length ? '검색 결과가 없어요.' : '아직 기록이 없어요. 신호가 잡히면 여기에 쌓여요.';
    $('#logBody').querySelectorAll('tr').forEach((tr, i) => tr.addEventListener('click', () => {
      select('h:' + tr.dataset.code + tr.dataset.date, rows[i]);
      window.scrollTo({top: 0, behavior: 'smooth'});
    }));
  }

  async function init() {
    let latest = {signals: [], asof: null};
    try { latest = await getJSON('data/latest.json'); } catch (e) { /* 아래 안내 문구로 처리 */ }
    try { history = await getJSON('data/history.json'); } catch (e) { history = []; }
    asof = latest.asof;
    today = latest.signals || [];
    $('#stamp').innerHTML = asof
      ? `<b>${esc(asof)}</b> 장 마감 기준 · 스캔 ${nf.format(latest.universe_size || 0)}종목 · 갱신 ${esc((latest.updated_at || '').slice(0, 16).replace('T', ' '))}`
      : '스캔 기록 없음';
    renderToday();
    renderLog();
    $('#q').addEventListener('input', renderLog);
    if (today.length) select('t:' + today[0].code, today[0]);
    else if (history.length) select('h:' + history[0].code + history[0].signal_date, history[0]);
    else ensureChart();
  }
  init();
})();
</script>
</body>
</html>
